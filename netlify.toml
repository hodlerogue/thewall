# The Next.js runtime is declared explicitly, and installed as a devDependency
# to match.
#
# Netlify is documented as auto-installing it on framework detection, and that
# did not happen here: the deploy log had no "Loading plugins" section, no
# function bundling, and no deploy step — just the Next build, then done. The
# result was `.next` served as a plain static folder, which has no index.html
# at its root, so every route 404s including the prerendered ones. Declaring it
# removes the dependency on detection firing.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

  # Netlify scans the build output for the values of your environment
  # variables and fails the build when it finds one. NEXT_PUBLIC_* values are
  # compiled into the client bundle on purpose — that is what the prefix
  # means — so without this the scanner correctly finds the anon key in the
  # JavaScript and stops the deploy.
  #
  # SUPABASE_SERVICE_ROLE_KEY is deliberately NOT listed. It bypasses every
  # RLS policy in the schema, it must never reach the browser, and leaving it
  # scanned means the build fails loudly if it ever does.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_SITE_URL"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Everything below is set in the Netlify UI, not here — this is a map of what
# the build expects, not a place to put values.
#
#   Site configuration -> Environment variables
#
# A demo deploy (no database, safe to share, nothing written anywhere):
#
#   NEXT_PUBLIC_USE_FIXTURES = 1
#
# A real deploy:
#
#   NEXT_PUBLIC_SUPABASE_URL       https://<project>.supabase.co
#   NEXT_PUBLIC_SUPABASE_ANON_KEY  public by design — RLS decides what it reads
#   SUPABASE_SERVICE_ROLE_KEY      server only, bypasses every policy
#   NEXT_PUBLIC_SITE_URL           the deployed origin, for the magic link
#
# NEXT_PUBLIC_* values are baked into the client bundle when the build runs, so
# adding one afterwards changes nothing until you redeploy. Set them first.
#
# NEXT_PUBLIC_SITE_URL must also be listed under Authentication -> URL
# Configuration -> Redirect URLs in Supabase, or the magic link is refused.
